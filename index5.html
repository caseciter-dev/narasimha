<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stotra Sangraha</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <style>
        :root { --primary: #5d4037; --bg: #fdfcf9; }
        
        /* Lock viewport to prevent mobile bouncing */
        html, body { 
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body { font-family: 'Georgia', serif; background: var(--bg); color: #333; }
        
        #settings-btn { position: fixed; top: 15px; right: 15px; z-index: 999; background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        #main-container { 
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
            max-width: 800px; 
            margin: auto; 
            padding: 70px 20px 20px 20px; 
            box-sizing: border-box; 
        }
        
        .entry-title { padding: 15px; border-bottom: 1px solid #e0dcd5; cursor: pointer; font-size: 1.2rem; font-weight: bold; background: white; }
        .entry-content { display: none; padding: 20px; background: #fff; border-bottom: 2px solid var(--primary); line-height: 1.7; }
        .entry-content.open { display: block; }

        #admin-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .admin-flex { display: flex; gap: 20px; }
        @media (max-width: 768px) { .admin-flex { flex-direction: column; } }
        
        .toolbar { background: #f0f0f0; padding: 10px; display: flex; gap: 5px; flex-wrap: wrap; border: 1px solid #ccc; border-radius: 5px 5px 0 0; }
        .toolbar button, .toolbar select { padding: 10px; cursor: pointer; border: 1px solid #bbb; }
        #editor { border: 1px solid #ccc; padding: 15px; min-height: 300px; background: #fff; outline: none; border-top: none; }
        #settings-modal { display: none; position: fixed; top: 60px; right: 15px; background: white; padding: 20px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 1000; }
    </style>
</head>
<body>

    <button id="settings-btn" onclick="toggleSettings()">Settings</button>

    <div id="settings-modal">
        <h3 style="margin-top:0">Display Settings</h3>
        <label>Font Size: <input type="range" id="fontSizeRange" min="14" max="30" value="18" oninput="updateFontSize(this.value)"></label>
        <hr>
        <button onclick="requestEdit()">Edit Library</button>
    </div>

    <div id="main-container">
        <h1 style="text-align:center; color:var(--primary);">ॐ नमो नारायणाय </h1>
        <div id="readerList">Loading...</div>
    </div>

    <div id="admin-overlay">
        <button onclick="closeAdmin()">Close Dashboard</button>
        <h2>Admin Dashboard</h2>
        <div class="admin-flex">
            <div style="flex: 1;">
                <h3>Entries</h3>
                <div id="adminList"></div>
                <hr>
                <button onclick="exportData()">Export JSON</button>
                <button onclick="document.getElementById('importInput').click()">Import JSON</button>
                <input type="file" id="importInput" style="display:none" onchange="importData(event)">
            </div>
            <div style="flex: 2;">
                <input type="hidden" id="editingId">
                <input type="text" id="codeId" placeholder="Name of Stotra" style="width:100%; padding:10px; margin-bottom:5px; box-sizing: border-box;">
                <div class="toolbar">
                    <button onclick="exec('bold')"><b>B</b></button>
                    <button onclick="exec('italic')"><i>I</i></button>
                    <button onclick="exec('justifyCenter')">Center</button>
                    <input type="color" onchange="exec('foreColor', this.value)">
                </div>
                <div id="editor" contenteditable="true"></div>
                <button onclick="saveCode()" style="padding:15px; margin-top:10px; width:100%;">Save to Memory</button>
            </div>
        </div>
    </div>

    <script>
        let registry = [];
        window.onload = async () => {
            // Prioritize library.json fetch[cite: 1]
            try {
                const res = await fetch('library.json');
                if (res.ok) {
                    registry = await res.json();
                    localStorage.setItem('stotraRegistry', JSON.stringify(registry));
                } else { throw new Error(); }
            } catch(e) {
                const saved = localStorage.getItem('stotraRegistry');
                if (saved) { registry = JSON.parse(saved); }
            }
            const savedSize = localStorage.getItem('userFontSize') || '18';
            document.getElementById('fontSizeRange').value = savedSize;
            renderAll();
            updateFontSize(savedSize);
        };

        function updateFontSize(val) {
            document.getElementById('main-container').style.fontSize = val + 'px';
            document.querySelectorAll('.entry-content').forEach(el => {
                el.style.fontSize = val + 'px';
                el.querySelectorAll('*').forEach(child => child.style.fontSize = val + 'px');
            });
            localStorage.setItem('userFontSize', val);
        }

        function exec(cmd, val = null) { document.execCommand(cmd, false, val); document.getElementById('editor').focus(); }
        function renderAll() { renderReader(); renderAdmin(); }
        function renderReader() { document.getElementById('readerList').innerHTML = registry.map(item => `<div class="entry-title" onclick="this.nextElementSibling.classList.toggle('open')">${item.id}</div><div class="entry-content">${DOMPurify.sanitize(item.content)}</div>`).join(''); }
        function renderAdmin() { document.getElementById('adminList').innerHTML = registry.map(item => `<div style="margin-bottom:10px;"><button onclick="editItem('${item.id}')">Edit</button> ${item.id}</div>`).join(''); }
        function saveCode() { const id = document.getElementById('codeId').value.trim(); const content = document.getElementById('editor').innerHTML; const editId = document.getElementById('editingId').value; if(!id) return; if(editId) { const idx = registry.findIndex(i => i.id === editId); registry[idx] = {id, content}; } else registry.push({id, content}); localStorage.setItem('stotraRegistry', JSON.stringify(registry)); renderAll(); updateFontSize(localStorage.getItem('userFontSize') || 18); alert("Saved!"); }
        function editItem(id) { const item = registry.find(i => i.id === id); document.getElementById('editingId').value = item.id; document.getElementById('codeId').value = item.id; document.getElementById('editor').innerHTML = item.content; }
        function toggleSettings() { const m = document.getElementById('settings-modal'); m.style.display = (m.style.display === 'block') ? 'none' : 'block'; }
        function requestEdit() { if(prompt("Enter Code:") === '1234') { document.getElementById('admin-overlay').style.display = 'block'; toggleSettings(); } }
        function closeAdmin() { document.getElementById('admin-overlay').style.display = 'none'; }
        function exportData() { const blob = new Blob([JSON.stringify(registry, null, 2)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'library.json'; a.click(); }
        function importData(e) { const reader = new FileReader(); reader.onload = (ev) => { registry = JSON.parse(ev.target.result); localStorage.setItem('stotraRegistry', JSON.stringify(registry)); renderAll(); }; reader.readAsText(e.target.files[0]); }
    </script>
</body>
</html>
