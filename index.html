  <style>
    /* ==========================================================================
       Sri Narasimha Stuti - Standalone CSS Design System
       ========================================================================== */

    :root {
      /* Divine Gold Theme (Default Dark) */
      --bg-primary: #0B0703;
      --bg-secondary: #140C05;
      --bg-card: rgba(28, 17, 8, 0.78);
      --bg-card-border: rgba(212, 175, 55, 0.28);
      --bg-glass: rgba(15, 7, 0, 0.90);
      
      --text-primary: #FAF3E0;
      --text-secondary: #D1C2A5;
      --text-muted: #8E7F65;
      
      --accent-gold: #D4AF37;
      --accent-gold-bright: #FFE680;
      --accent-saffron: #FF9933;
      --accent-crimson: #C0392B;
      --accent-glow: rgba(212, 175, 55, 0.35);

      --font-sanskrit: 'Noto Serif Devanagari', 'Tiro Devanagari Sanskrit', serif;
      --font-english: 'Outfit', sans-serif;
      --font-heading: 'Cinzel', serif;

      --header-height: 64px;
      --base-font-size: 1.2rem;
      --border-radius-lg: 20px;
      --border-radius-md: 12px;
      --border-radius-sm: 8px;
      
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-normal: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Light Theme - Sandalwood Parchment */
    [data-theme="sandalwood"] {
      --bg-primary: #FDF9EE;
      --bg-secondary: #F6EDD9;
      --bg-card: rgba(255, 255, 255, 0.90);
      --bg-card-border: rgba(184, 134, 11, 0.3);
      --bg-glass: rgba(253, 249, 238, 0.94);
      
      --text-primary: #2C1B0B;
      --text-secondary: #5A422D;
      --text-muted: #8C7561;
      
      --accent-gold: #B8860B;
      --accent-gold-bright: #8B6508;
      --accent-saffron: #D96B00;
      --accent-crimson: #8B0000;
      --accent-glow: rgba(184, 134, 11, 0.2);
      
      --shadow-card: 0 10px 30px rgba(74, 53, 30, 0.08);
    }

    /* Midnight Blue Theme */
    [data-theme="midnight"] {
      --bg-primary: #050B14;
      --bg-secondary: #0A1424;
      --bg-card: rgba(14, 26, 46, 0.80);
      --bg-card-border: rgba(77, 166, 255, 0.28);
      --bg-glass: rgba(5, 11, 20, 0.92);
      
      --text-primary: #E6F1FF;
      --text-secondary: #A0C2E8;
      --text-muted: #5C7B9E;
      
      --accent-gold: #4DA6FF;
      --accent-gold-bright: #99CCFF;
      --accent-saffron: #FF9933;
      --accent-crimson: #FF4D4D;
      --accent-glow: rgba(77, 166, 255, 0.3);
    }

    /* Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-english);
      font-size: 16px;
      line-height: 1.6;
      transition: background-color var(--transition-normal), color var(--transition-normal);
    }

    /* App Shell Container */
    #app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 680px;
      margin: 0 auto;
      position: relative;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.6);
      background-color: var(--bg-primary);
    }

    /* Glassmorphism Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--header-height);
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--bg-card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-logo {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 0 6px var(--accent-glow));
    }

    .header-title {
      font-family: var(--font-heading);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent-gold-bright);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Font Size Quick Controls */
    .font-size-ctrls {
      display: flex;
      align-items: center;
      background: var(--bg-secondary);
      border: 1px solid var(--bg-card-border);
      border-radius: 20px;
      padding: 2px 6px;
      gap: 4px;
    }

    .btn-font {
      background: transparent;
      border: none;
      color: var(--accent-gold-bright);
      font-weight: 700;
      font-size: 0.88rem;
      padding: 4px 6px;
      cursor: pointer;
      border-radius: 10px;
      transition: background var(--transition-fast);
    }

    .btn-font:active {
      background: var(--accent-glow);
    }

    .font-size-val {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 600;
      min-width: 38px;
      text-align: center;
    }

    /* Theme Picker Dots */
    .theme-picker-bar {
      display: flex;
      gap: 5px;
    }

    .theme-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform var(--transition-fast);
    }

    .theme-dot:active {
      transform: scale(0.9);
    }

    .theme-dot.gold { background: #D4AF37; }
    .theme-dot.sandalwood { background: #F6EDD9; border-color: #B8860B; }
    .theme-dot.midnight { background: #0A1424; border-color: #4DA6FF; }

    /* Install PWA Button */
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-gold), var(--accent-saffron));
      color: #000;
      border: none;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.3);
      transition: transform var(--transition-fast);
      white-space: nowrap;
    }

    .btn-primary:active {
      transform: scale(0.95);
    }

    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px;
    }

    /* PWA Install Banner */
    .pwa-banner {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(255, 153, 51, 0.1));
      border: 1px solid var(--accent-gold);
      border-radius: var(--border-radius-md);
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .pwa-banner-text {
      flex: 1;
    }

    .pwa-banner-title {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--accent-gold-bright);
    }

    .pwa-banner-desc {
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.3;
    }

    /* Script & Display Controls Bar */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 20px;
      background: var(--bg-secondary);
      padding: 6px 10px;
      border-radius: 30px;
      border: 1px solid var(--bg-card-border);
    }

    .pill-group {
      display: flex;
      gap: 4px;
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .pill-btn.active {
      background: var(--accent-gold);
      color: #0F0700;
      box-shadow: 0 2px 10px rgba(212, 175, 55, 0.25);
    }

    /* View Container */
    .view-content {
      flex: 1;
      padding: 16px 16px 40px 16px;
    }

    /* Section Header */
    .section-header {
      margin: 28px 0 16px 0;
      text-align: center;
      position: relative;
    }

    .section-header::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--bg-card-border), transparent);
      z-index: 0;
    }

    .section-title-badge {
      position: relative;
      z-index: 1;
      display: inline-block;
      background: var(--bg-primary);
      border: 1px solid var(--accent-gold);
      padding: 4px 18px;
      border-radius: 20px;
      color: var(--accent-gold-bright);
      font-family: var(--font-heading);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .section-author {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-style: italic;
    }

    /* Verse Card - CRITICAL WORD WRAP FIXES */
    .verse-card {
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      border-radius: var(--border-radius-lg);
      padding: 20px 18px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      position: relative;
      
      /* PREVENT TEXT OVERFLOW PAST CARD BOUNDARIES */
      overflow: hidden;
      overflow-wrap: anywhere;
      word-break: break-word;
      max-width: 100%;
    }

    .verse-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .verse-badge {
      background: rgba(212, 175, 55, 0.15);
      color: var(--accent-gold-bright);
      border: 1px solid var(--bg-card-border);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      font-family: var(--font-sanskrit);
    }

    .verse-section-name {
      font-size: 0.75rem;
      color: var(--accent-saffron);
      font-weight: 500;
    }

    .verse-sanskrit {
      font-family: var(--font-sanskrit);
      font-size: var(--base-font-size);
      color: var(--text-primary);
      line-height: 1.8;
      text-align: center;
      white-space: pre-line;
      margin-bottom: 12px;
      font-weight: 500;
      
      /* PREVENT LONG SANSKRIT WORD OVERFLOW */
      overflow-wrap: anywhere;
      word-break: break-word;
      hyphens: auto;
      max-width: 100%;
    }

    .verse-iast {
      font-family: var(--font-english);
      font-size: calc(var(--base-font-size) * 0.82);
      color: var(--accent-gold-bright);
      line-height: 1.6;
      text-align: center;
      white-space: pre-line;
      margin-bottom: 14px;
      font-style: italic;
      opacity: 0.95;
      
      /* PREVENT LONG IAST COMPOUND WORD OVERFLOW */
      overflow-wrap: anywhere;
      word-break: break-word;
      hyphens: auto;
      max-width: 100%;
    }

    .verse-meaning {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.55;
      border-top: 1px dashed var(--bg-card-border);
      padding-top: 12px;
      margin-top: 12px;
      
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .meaning-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-saffron);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      display: block;
    }

    .concluding-box {
      text-align: center;
      background: rgba(255, 153, 51, 0.08);
      border: 1px dashed var(--accent-saffron);
      border-radius: var(--border-radius-md);
      padding: 14px;
      margin: 20px 0 30px 0;
      font-family: var(--font-sanskrit);
      font-size: 0.95rem;
      color: var(--accent-gold-bright);
      
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--bg-card-border);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header Bar -->
    <header class="app-header">
      <div class="header-brand">
        <svg class="header-logo" viewBox="0 0 512 512">
          <circle cx="256" cy="256" r="230" fill="#0F0700" stroke="#D4AF37" stroke-width="16"/>

        <span class="header-title">श्री नृसिंह स्तुति</span>

      <div class="header-actions">

        <div class="font-size-ctrls" title="Font Size">
          <button class="btn-font" onclick="app.decreaseFontSize()" title="Decrease font size">A-</button>

        <!-- Theme Quick Dots -->
        <div class="theme-picker-bar">
          <button class="theme-dot gold" onclick="app.applyTheme('gold')" title="Divine Gold Dark"></button>
          <button class="theme-dot sandalwood" onclick="app.applyTheme('sandalwood')" title="Sandalwood Light"></button>
          <button class="theme-dot midnight" onclick="app.applyTheme('midnight')" title="Midnight Blue"></button>
        </div>

        <!-- Header Install PWA Button -->
        <button id="btn-header-install" class="btn-primary" style="display: none;" onclick="installPWA()">Install</button>
      </div>
    </header>

    <!-- Reader Main Content Container -->
    <main id="reader-container" class="view-content">
      <!-- Injected dynamically via script below -->
    </main>
  </div>

    /* ==========================================================================
       Application State & UI Controller
       ========================================================================== */
    class StandaloneApp {
      constructor() {
        this.currentScript = localStorage.getItem('pref_script') || 'both'; // devanagari, iast, both
        this.showMeaning = localStorage.getItem('pref_meaning') !== 'false';
        this.currentTheme = localStorage.getItem('pref_theme') || 'gold';
        this.fontSize = parseFloat(localStorage.getItem('pref_font_size') || '1.2');
      }

      init() {
        this.applyTheme(this.currentTheme);
        this.applyFontSize(this.fontSize);
        this.renderReader();
      }

      applyTheme(theme) {
        this.currentTheme = theme;
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('pref_theme', theme);
      }

      applyFontSize(size) {
        this.fontSize = Math.min(2.4, Math.max(0.9, parseFloat(size)));
        document.documentElement.style.setProperty('--base-font-size', `${this.fontSize}rem`);
        localStorage.setItem('pref_font_size', this.fontSize);

        const label = document.getElementById('font-size-label');
        if (label) {
          label.textContent = `${Math.round(this.fontSize * 100)}%`;
        }
      }

      increaseFontSize() {
        this.applyFontSize(this.fontSize + 0.1);
      }

      decreaseFontSize() {
        this.applyFontSize(this.fontSize - 0.1);
      }

      setScript(script) {
        this.currentScript = script;
        localStorage.setItem('pref_script', script);
        this.renderReader();
      }

      toggleMeaning() {
        this.showMeaning = !this.showMeaning;
        localStorage.setItem('pref_meaning', this.showMeaning);
        this.renderReader();
      }

        const container = document.getElementById('reader-container');
        if (!container) return;

        let html = `

              <div class="pwa-banner-title">Install Narasimha Stuti App</div>
              <div class="pwa-banner-desc">Add to Home Screen for offline reading & quick access</div>

            <button class="btn-primary" onclick="installPWA()">Install</button>
            <button class="btn-close" onclick="dismissPWABanner()">✕</button>
          </div>

          <!-- Reading Preference Controls Bar -->
          <div class="controls-bar">
            <div class="pill-group">
              <button class="pill-btn ${this.currentScript === 'devanagari' ? 'active' : ''}" onclick="app.setScript('devanagari')">संस्कृत</button>
              <button class="pill-btn ${this.currentScript === 'iast' ? 'active' : ''}" onclick="app.setScript('iast')">IAST</button>
              <button class="pill-btn ${this.currentScript === 'both' ? 'active' : ''}" onclick="app.setScript('both')">Both</button>
            </div>

            <button class="pill-btn ${this.showMeaning ? 'active' : ''}" onclick="app.toggleMeaning()">
              Meaning ${this.showMeaning ? 'ON' : 'OFF'}
            </button>
          </div>
        `;

        STUTI_DATA.sections.forEach(sec => {
          html += `
            <div class="section-header">
              <div class="section-title-badge">${sec.title}</div>
              <div class="section-author">${sec.author}</div>
            </div>
          `;

          sec.verses.forEach(v => {
            html += `
              <div class="verse-card" id="verse-${v.id}">
                <div class="verse-meta">
                  <div class="verse-badge">${v.number}</div>
                  <span class="verse-section-name">${sec.titleEn}</span>
                </div>

                ${(this.currentScript === 'devanagari' || this.currentScript === 'both') ? `<div class="verse-sanskrit">${v.sanskrit}</div>` : ''}
                ${(this.currentScript === 'iast' || this.currentScript === 'both') ? `<div class="verse-iast">${v.iast}</div>` : ''}
                
                ${this.showMeaning ? `
                  <div class="verse-meaning">
                    <span class="meaning-label">Meaning</span>
                    ${v.meaning}
                  </div>
                ` : ''}
              </div>
            `;
          });

          if (sec.concludingText) {
            html += `<div class="concluding-box">${sec.concludingText}</div>`;
          }
        });

        container.innerHTML = html;
      }
    }

    const app = new StandaloneApp();
    window.addEventListener('DOMContentLoaded', () => app.init());

    /* ==========================================================================
       PWA Installer Script (Service Worker Integration)
       ========================================================================== */
    let deferredInstallPrompt = null;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('[PWA] Service Worker registered:', reg.scope))
          .catch(() => {/* Offline fallback */});
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      const banner = document.getElementById('pwa-install-banner');
      if (banner && !localStorage.getItem('pwa_banner_dismissed')) {
        banner.style.display = 'flex';
      }
      const headerBtn = document.getElementById('btn-header-install');
      if (headerBtn) headerBtn.style.display = 'inline-block';
    });

    function installPWA() {
      if (!deferredInstallPrompt) {
        alert('To install on iOS: Tap Share > "Add to Home Screen". On Chrome Desktop: Click Install icon in address bar.');
        return;
      }
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.then(() => {
        deferredInstallPrompt = null;
        const banner = document.getElementById('pwa-install-banner');
        if (banner) banner.style.display = 'none';
      });
    }

    function dismissPWABanner() {
      const banner = document.getElementById('pwa-install-banner');
      if (banner) banner.style.display = 'none';
      localStorage.setItem('pwa_banner_dismissed', 'true');
    }
  </script>
</body>
</html>
